
name: 编译生成二进制文件

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:

      - name: 显示当前目录
        shell: cmd
        run: |
          echo DEPOT_TOOLS_WIN_TOOLCHAIN %DEPOT_TOOLS_WIN_TOOLCHAIN%
          echo GIT_CACHE_PATH %GIT_CACHE_PATH%
          echo GIT_CACH_PATH %GIT_CACHE_PATH%
          echo CHROMIUM_BUILDTOOLS_PATH %CHROMIUM_BUILDTOOLS_PATH%
          echo cd %cd%
          dir

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 安装编译工具
        run: |
          npm install -g @electron/build-tools

      - name: 检出并编译
        shell: cmd
        run: |
          setx DEPOT_TOOLS_WIN_TOOLCHAIN 0
          setx GIT_CACHE_PATH %userprofile%\.git_cache
          git config --global core.filemode false
          git config --global core.autocrlf false
          git config --global branch.autosetuprebase always
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global core.longpaths true
          setx CHROMIUM_BUILDTOOLS_PATH %cd%\buildtools
          refreshenv
          if not exist "%GIT_CACHE_PATH%" md "%GIT_CACHE_PATH%"
          git clone https://github.com/yunxu1019/electron-22.3.27 src/electron
          cd src/electron
          git pull
          gn gen out/Release --args="import(\"//electron/build/args/release.gn\")"
          dir /b


      # - name: 安装依赖
      #   run: |
      #     npm install -g yarn
      #     yarn install --frozen-lockfile

      - name: 看看当前目录都有些什么
        run: |
          cd
          dir
          dir out
          dir chromium_src
        shell: cmd

